[theme.light]
primaryColor = "#F2A33A"
backgroundColor = "#F6F2EA"
secondaryBackgroundColor = "#ECE5D8"
textColor = "#0F1B2D"
borderColor = "#DDD3C2"

[theme.dark]
primaryColor = "#F2A33A"
backgroundColor = "#0F1B2D"
secondaryBackgroundColor = "#18283F"
textColor = "#F3EEE4"
borderColor = "#2A3D58"

# The demo hides Streamlit's own toolbar items (Deploy, the top-right menu); theme follows the system setting.
[client]
toolbarMode = "minimal"
