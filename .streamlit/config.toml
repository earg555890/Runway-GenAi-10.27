# Runway theme, "night runway": night navy, warm paper, one amber accent (runway lights). Red means "below $0" only,
# green "covered / good news" only (readability standard). Set per mode so the viewer can still pick light, dark or
# system. Fonts load from Google Fonts: Atkinson Hyperlegible (body, chosen for readability), Bricolage Grotesque
# (headings), DM Mono (numbers and dates, tabular), with DM Sans digits (plain zero). style.py adds the rest (cards, the header band, motion).
[theme]
font = "Runway Body, sans-serif"
headingFont = "Bricolage Grotesque:https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap"
codeFont = "Runway Mono, monospace"
baseRadius = "0.9rem"
buttonRadius = "0.7rem"

# Runway Body = Atkinson Hyperlegible for everything but digits + DM Sans digits; Runway Mono = DM Mono for everything
# but digits + DM Sans digits. Atkinson and DM Mono draw a slashed zero ("$4ØØ") and have no OpenType feature to turn
# it off; DM Sans (DM Mono's sibling) has a plain zero and tabular figures. Files from Google Fonts (latin subset).
# Each digit face has exactly the weight and style of its letter face: browsers match weight before unicode-range.
[[theme.fontFaces]]
family = "Runway Body"
url = "https://fonts.gstatic.com/s/atkinsonhyperlegible/v12/9Bt23C1KxNDXMspQ1lPyU89-1h6ONRlW45G04pIo.woff2"
weight = "400"
style = "normal"
unicodeRange = "U+0000-002F, U+003A-FFFF"

[[theme.fontFaces]]
family = "Runway Body"
url = "https://fonts.gstatic.com/s/dmsans/v17/rP2Hp2ywxg089UriCZOIHQ.woff2"
weight = "400"
style = "normal"
unicodeRange = "U+0030-0039"

